<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Not on the rail · Tasting Board</title>
<meta name="robots" content="noindex">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@900&family=Martian+Mono:wght@400;600&family=Schibsted+Grotesk:wght@400;600&display=swap">
<style>
:root {
  --steel: #E1E5E8; --paper: #FCFCFA; --ink: #15181B; --muted: #59636B; --rule: #C3CAD0; --accent: #1E5C86;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root { --steel: #101317; --paper: #1C2127; --ink: #ECEFF1; --muted: #9BA6AF; --rule: #2D343C; --accent: #8CC2EA; color-scheme: dark; }
}
* { box-sizing: border-box; }
body {
  margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--steel); color: var(--ink);
  font: 400 16px/1.55 "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
  padding: 32px max(16px, env(safe-area-inset-right, 0px)) 32px max(16px, env(safe-area-inset-left, 0px));
}
.ticket { width: min(420px, 100%); background: var(--paper); padding: 26px 22px 30px; box-shadow: 0 14px 26px -18px rgba(20, 30, 40, .55); }
.top { display: flex; justify-content: space-between; font: 600 11px/1 "Martian Mono", ui-monospace, monospace; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); padding-bottom: 12px; border-bottom: 1px dashed var(--rule); }
h1 { font: 900 64px/.9 "Big Shoulders Display", "Arial Narrow", Impact, sans-serif; text-transform: uppercase; margin: 18px 0 10px; }
p { margin: 0 0 20px; color: var(--muted); }
a { display: inline-block; font-weight: 600; color: var(--paper); background: var(--ink); padding: 12px 16px; border-radius: 3px; text-decoration: none; }
a:hover, a:focus-visible { background: var(--accent); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
  <main class="ticket">
    <div class="top"><span>No. 404</span><span>Void</span></div>
    <h1>Not on the rail</h1>
    <p>This page isn't one of the ten mockups. The full set is on the board.</p>
    <a href="/">Back to the Tasting Board</a>
  </main>
</body>
</html>
